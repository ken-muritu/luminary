<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminary | Stage Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #FFFFFF;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .stage-text {
      line-height: 1.1;
      text-shadow: 0 0 20px rgba(0,0,0,1);
    }

    main {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
      position: relative;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .service-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .service-mode {
      color: #f0bf63;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .live-dot {
      width: 0.75rem;
      height: 0.75rem;
      background: #4bddb7;
      border-radius: 50%;
      box-shadow: 0 0 10px #4bddb7;
    }

    .live-text {
      color: #C8C4D7;
      font-size: 1.25rem;
      font-weight: 500;
    }

    .clock {
      text-align: right;
    }

    .clock-time {
      color: #ffffff;
      font-size: 5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .clock-label {
      color: #928ea0;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 0.5rem;
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 6rem;
    }

    .slide-text {
      max-width: 1200px;
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      position: relative;
    }

    .next-slide {
      width: 33%;
      background: rgba(27, 27, 34, 0.8);
      padding: 1.5rem;
      border-radius: 0.75rem;
      border-left: 6px solid #f0bf63;
    }

    .next-label {
      color: #f0bf63;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
    }

    .next-text {
      color: #ffffff;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .verse-reference {
      position: absolute;
      left: 50%;
      bottom: 1rem;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .reference-box {
      background: rgba(42, 41, 49, 0.8);
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      border: 1px solid rgba(71, 69, 84, 0.3);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .reference-icon {
      color: #c6bfff;
      font-size: 1.25rem;
    }

    .reference-text {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .reference-label {
      color: #928ea0;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-top: 0.5rem;
    }

    .confidence-meter {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1rem;
    }

    .tempo-key {
      display: flex;
      gap: 1rem;
    }

    .meter-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .meter-label {
      color: #928ea0;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .meter-value {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .meter-unit {
      font-size: 0.875rem;
      font-weight: 500;
      color: #928ea0;
    }

    .divider {
      width: 1px;
      height: 3rem;
      background: rgba(71, 69, 84, 0.3);
    }

    .confidence-bars {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .conf-bar {
      width: 3rem;
      height: 0.5rem;
      background: rgba(75, 221, 183, 0.2);
      border-radius: 9999px;
    }

    .conf-bar.active {
      background: #4bddb7;
    }

    .conf-label {
      color: #928ea0;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-left: 0.5rem;
    }

    /* Status Bar */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5rem;
      background: #13131a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3rem;
      border-top: 1px solid #1B1B22;
    }

    .status-left, .status-right {
      display: flex;
      gap: 2rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .status-item.success {
      color: #4bddb7;
      font-weight: 700;
    }

    .status-item.info {
      color: #C8C4D7;
    }

    .status-icon {
      width: 1rem;
      height: 1rem;
    }

    /* Top accent bar */
    .accent-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(to right, #6c5ce7, #4bddb7, #f0bf63);
    }

    /* Hidden by default */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  
  <main>
    <!-- Header -->
    <header>
      <div class="service-info">
        <div class="service-mode">Service Mode</div>
        <div class="live-indicator">
          <div class="live-dot"></div>
          <div class="live-text">LIVE ON MAIN STAGE</div>
        </div>
      </div>
      
      <div class="clock">
        <div class="clock-time" id="clock">10:42 AM</div>
        <div class="clock-label">System Time • Synced</div>
      </div>
    </header>

    <!-- Main Content -->
    <section class="main-content">
      <div class="slide-text" id="current-slide">
        Verse 1: Amazing grace, how sweet the sound...
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <!-- Next Slide -->
      <div class="next-slide">
        <div class="next-label">Next Slide</div>
        <div class="next-text" id="next-slide">
          That saved a wretch like me...
        </div>
      </div>

      <!-- Verse Reference -->
      <div class="verse-reference">
        <div class="reference-box">
          <span class="reference-icon">📖</span>
          <span class="reference-text" id="reference">John 3:16</span>
        </div>
        <div class="reference-label">Current Context</div>
      </div>

      <!-- Confidence Meter -->
      <div class="confidence-meter">
        <div class="tempo-key">
          <div class="meter-item">
            <div class="meter-label">Tempo</div>
            <div class="meter-value">72 <span class="meter-unit">BPM</span></div>
          </div>
          <div class="divider"></div>
          <div class="meter-item">
            <div class="meter-label">Key</div>
            <div class="meter-value">G# <span class="meter-unit">Maj</span></div>
          </div>
        </div>
        <div class="confidence-bars">
          <div class="conf-bar active"></div>
          <div class="conf-bar active"></div>
          <div class="conf-bar active"></div>
          <div class="conf-bar"></div>
          <span class="conf-label">Confidence</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-left">
      <div class="status-item success">
        <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
        </svg>
        <span>Audio Levels: Peak -3dB</span>
      </div>
      <div class="status-item info">
        <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/>
        </svg>
        <span>AI Status: Monitoring Tempo</span>
      </div>
    </div>
    <div class="status-right">
      <div class="status-item info">
        <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
        <span>Display 01</span>
      </div>
      <div class="status-item info">
        <svg class="status-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <span>Operator: Admin</span>
      </div>
    </div>
  </div>

  <script>
    // Clock update
    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const displayHours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${displayHours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // IPC handlers for stage display
    const currentSlideEl = document.getElementById('current-slide');
    const nextSlideEl = document.getElementById('next-slide');
    const referenceEl = document.getElementById('reference');

    window.__LUMINARY_STAGE__ = {
      setContent: (data) => {
        if (data.current) currentSlideEl.textContent = data.current;
        if (data.next) nextSlideEl.textContent = data.next;
        if (data.reference) referenceEl.textContent = data.reference;
      }
    };
  </script>
</body>
</html>
