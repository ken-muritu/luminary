<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luminary Output</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--font, 'Inter', system-ui, sans-serif);
      font-size: var(--font-size, 48px);
      text-align: center;
      padding: 5vw;
      overflow: hidden;
    }
    #content { max-width: 90vw; text-shadow: 0 2px 8px rgba(0,0,0,0.5); line-height: 1.3; }
    #subtext { font-size: 0.5em; opacity: 0.7; margin-top: 1em; }
    body.blank #content, body.blank #subtext { display: none; }
    body.logo { background: #13131a url('/luminary-icon.svg') center/20vmin no-repeat; }
    body.logo #content, body.logo #subtext { display: none; }
    body.freeze #content { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="content"></div>
  <div id="subtext"></div>
  <script>
    const channel = new BroadcastChannel('luminary-projection');
    function applySlide(data) {
      if (data.type === 'slide') {
        document.getElementById('content').textContent = data.text || '';
        document.getElementById('subtext').textContent = data.subtext || '';
        document.body.className = '';
        document.body.style.setProperty('--font', data.fontFamily || 'Inter');
        document.body.style.setProperty('--font-size', (data.fontSize || 48) + 'px');
      } else if (data.type === 'blank') {
        document.body.className = 'blank';
      } else if (data.type === 'logo') {
        document.body.className = 'logo';
      } else if (data.type === 'freeze') {
        document.body.classList.toggle('freeze');
      }
    }
    window.addEventListener('message', (e) => applySlide(e.data));
    channel.onmessage = (e) => applySlide(e.data);
    window.opener?.postMessage({ type: 'output-ready' }, '*');
    channel.postMessage({ type: 'output-ready' });
  </script>
</body>
</html>
