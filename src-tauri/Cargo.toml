[package]
name = "luminary"
version = "3.0.0"
description = "Luminary church presentation software"
authors = ["Kennedy Muritu"]
edition = "2021"

[lib]
name = "luminary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
